name: Android

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths: ['android/**', 'assets/**', 'index.html', 'stems.html', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'assets/**', 'index.html', 'stems.html', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the APK as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUSIC_STAGE_VERSION_CODE: ${{ github.run_number }}
      MUSIC_STAGE_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIC_STAGE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/music-stage-release.p12"
            echo "MUSIC_STAGE_KEYSTORE=$RUNNER_TEMP/music-stage-release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret is configured; this APK uses a temporary debug key."
          fi

      - name: Engine tests and release build
        working-directory: android
        env:
          MUSIC_STAGE_KEYSTORE_PASSWORD: ${{ secrets.MUSIC_STAGE_KEYSTORE_PASSWORD }}
          MUSIC_STAGE_KEY_ALIAS: ${{ secrets.MUSIC_STAGE_KEY_ALIAS }}
          MUSIC_STAGE_KEY_PASSWORD: ${{ secrets.MUSIC_STAGE_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$apk" | head -n 5
          unzip -l "$apk" | grep -q 'assets/web/index.html'
          cp "$apk" "MusicStage-$MUSIC_STAGE_VERSION_NAME.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: MusicStage-${{ env.MUSIC_STAGE_VERSION_NAME }}
          path: MusicStage-*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v$MUSIC_STAGE_VERSION_NAME" "MusicStage-$MUSIC_STAGE_VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "Music Stage for Android $MUSIC_STAGE_VERSION_NAME" \
            --notes-file android/RELEASE_NOTES.md
